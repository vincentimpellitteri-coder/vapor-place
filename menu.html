<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu — The Vapor Place</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .menu-controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      background: #0d0d0d;
      padding: 12px 0;
      margin-bottom: 16px;
    }
    #menu-search {
      flex: 1;
      min-width: 200px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      color: #f0f0f0;
      font-family: 'Rajdhani', sans-serif;
      font-size: 1rem;
      padding: 10px 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    #menu-search:focus { border-color: #00e5ff; }
    .filter-btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-btn {
      background: transparent;
      border: 1px solid #333;
      border-radius: 6px;
      color: #999;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 8px 14px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    .filter-btn:hover, .filter-btn.active {
      border-color: #00e5ff;
      color: #00e5ff;
      background: rgba(0,229,255,0.06);
    }
    #menu-count {
      color: #999;
      font-size: 0.85rem;
      margin-bottom: 16px;
    }
    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .menu-item {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 14px 16px;
      transition: border-color 0.2s;
    }
    .menu-item:hover { border-color: #00e5ff44; }
    .menu-item-name {
      font-size: 1.19rem;
      color: #f0f0f0;
      margin-bottom: 4px;
      font-weight: 600;
    }
    .menu-item-profile {
      font-size: 0.82rem;
      color: #666;
      line-height: 1.4;
    }
    .menu-item-type {
      display: inline-block;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.55rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 2px 7px;
      border-radius: 4px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .type-DISP { background: rgba(0,229,255,0.12); color: #00e5ff; }
    .type-SALT { background: rgba(170,255,0,0.12); color: #aaff00; }
    .type-SUB  { background: rgba(255,170,0,0.12); color: #ffaa00; }
    .type-KIT  { background: rgba(200,100,255,0.12); color: #c864ff; }
    #no-results {
      display: none;
      text-align: center;
      color: #999;
      padding: 60px 0;
      font-size: 1rem;
    }
  </style>
</head>
<body id="inner-page">

  <div style="position:relative;z-index:1;">

  <header>
    <div class="header-inner">
      <a href="home.html" class="logo-link">
        <img src="images/logo.png" alt="The Vapor Place" class="logo-img">
      </a>
      <span class="badge-21">21+</span>
    </div>
    <nav>
      <a href="home.html">Home</a>
      <a href="hours.html">Hours</a>
      <a href="menu.html" class="active">Menu</a>
      <a href="brands.html">Brands</a>
      <a href="featured.html">Featured</a>
      <a href="top-sellers.html">Top Sellers</a>
      <a href="locations.html">Locations</a>
      <a href="contact.html">Contact</a>
      <a href="info.html">Info</a>
      <a href="rewards.html">Rewards</a>
      <a href="kits.html">Kits</a>
    </nav>
  </header>

  <main>
    <h1>Our Menu</h1>

    <div class="menu-controls">
      <input id="menu-search" type="text" placeholder="Search by name or flavor...">
      <div class="filter-btns">
        <button class="filter-btn active" data-type="ALL">All</button>
        <button class="filter-btn" data-type="DISP">Disposables</button>
        <button class="filter-btn" data-type="SALT">Salts</button>
        <button class="filter-btn" data-type="SUB">Sub-Ohm</button>
        <button class="filter-btn" data-type="KIT">Kits</button>
      </div>
    </div>

    <div id="menu-count"></div>
    <div class="menu-list" id="menu-list"></div>
    <div id="no-results">No items match your search.</div>
  </main>

  <footer>
    &copy; 2026 The Vapor Place &mdash; Must be 21+ to purchase.
  </footer>

  <script src="js/app.js"></script>
  <script src="js/menu-data.js?v=3"></script>
  <script>
    let allItems = MENU_DATA;
    let activeType = 'ALL';

    const typeLabels = { DISP: 'Disposable', SALT: 'Salt Nic', SUB: 'Sub-Ohm', KIT: 'Kit' };

    const PINNED_NAMES = [
      "SALT Slapple",
      "SALT MRKT PLCE Fuji Pear Mangoberry"
    ];

    function itemTypeMatch(item, type) {
      if (type === 'ALL') return true;
      return item.types ? item.types.includes(type) : item.name.startsWith(type);
    }

    render();

    function render() {
      const query = document.getElementById('menu-search').value.toLowerCase();
      const list = document.getElementById('menu-list');
      const count = document.getElementById('menu-count');
      const noResults = document.getElementById('no-results');

      const filtered = allItems.filter(item => {
        const typeMatch = itemTypeMatch(item, activeType);
        const searchMatch = !query ||
          item.name.toLowerCase().includes(query) ||
          item.profile.toLowerCase().includes(query) ||
          (item.tags && item.tags.toLowerCase().includes(query));
        return typeMatch && searchMatch;
      }).sort((a, b) => {
        const nameA = a.name.replace(/^(DISP|SALT|SUB|KIT)\s+/, '').toLowerCase();
        const nameB = b.name.replace(/^(DISP|SALT|SUB|KIT)\s+/, '').toLowerCase();
        return nameA.localeCompare(nameB);
      });

      const pinned = PINNED_NAMES
        .map(name => allItems.find(i => i.name === name))
        .filter(item => item && itemTypeMatch(item, activeType) && (
          !query ||
          item.name.toLowerCase().includes(query) ||
          item.profile.toLowerCase().includes(query) ||
          (item.tags && item.tags.toLowerCase().includes(query))
        ));

      count.textContent = filtered.length + ' item' + (filtered.length !== 1 ? 's' : '');
      list.innerHTML = '';
      noResults.style.display = filtered.length === 0 ? 'block' : 'none';

      [...pinned, ...filtered].forEach(item => {
        const type = item.name.split(' ')[0];
        const displayName = item.name.replace(/^(DISP|SALT|SUB|KIT)\s+/, '');
        const isDual = item.types && item.types.length > 1;
        const badgeHtml = isDual
          ? item.types.map(t => `<div class="menu-item-type type-${t}" style="display:inline-block;margin-right:4px;">${typeLabels[t] || t}</div>`).join('')
          : `<div class="menu-item-type type-${type}">${typeLabels[type] || type}</div>`;
        let profileHtml = '';
        if (item.profile) {
          if (item.profile.includes('|')) {
            const [sizes, flavor] = item.profile.split('|').map(s => s.trim());
            profileHtml = `<div class="menu-item-profile" style="font-size:0.98rem;color:#ffcc00;text-align:center;margin-bottom:6px;">${flavor}</div>
                           <div class="menu-item-profile" style="font-size:0.82rem;color:#aaa;text-align:center;margin-bottom:8px;">${sizes}</div>`;
          } else {
            profileHtml = `<div class="menu-item-profile" style="font-size:0.98rem;color:#ffcc00;text-align:center;margin-bottom:6px;">${item.profile}</div>`;
          }
        }
        const div = document.createElement('div');
        div.className = 'menu-item';

        if (item.name === 'SALT MRKT PLCE Forbidden Berry' && item.profile && item.profile.includes('|')) {
          const [sizes, flavor] = item.profile.split('|').map(s => s.trim());
          div.innerHTML = `
            <div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;margin-bottom:10px;">
              <div class="menu-item-name" style="text-align:left;font-size:1.3rem;">${displayName}</div>
              ${item.image ? `<img src="images/${item.image}" alt="${displayName}" style="width:180px;border-radius:6px;object-fit:contain;max-height:140px;background:#111;">` : ''}
              <div style="font-size:0.98rem;color:#ffcc00;text-align:right;">${flavor}</div>
            </div>
            <div style="font-size:0.82rem;color:#aaa;text-align:center;margin-bottom:6px;">${sizes}</div>
            <div style="display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:4px;">${badgeHtml}</div>
          `;
        } else {
          div.innerHTML = `
            <div class="menu-item-name" style="text-align:center;margin-bottom:10px;">${displayName}</div>
            ${item.image ? `<img src="images/${item.image}" alt="${displayName}" style="width:100%;border-radius:6px;margin-bottom:10px;object-fit:contain;max-height:160px;background:#111;">` : ''}
            ${profileHtml}
            <div style="display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:4px;">${badgeHtml}</div>
            ${item.price ? `<div style="font-family:'Orbitron',sans-serif;font-size:1rem;font-weight:700;color:#aaff00;margin-top:8px;text-align:center;">${item.price}</div>` : ''}
            ${item.link ? `<a href="${item.link}" style="display:block;margin-top:10px;font-size:0.75rem;color:#00e5ff;text-decoration:none;font-family:'Orbitron',sans-serif;letter-spacing:0.05em;text-align:center;">Learn More &rarr;</a>` : ''}
          `;
        }
        list.appendChild(div);
      });
    }

    const params = new URLSearchParams(window.location.search);
    if (params.get('q')) {
      document.getElementById('menu-search').value = params.get('q');
      render();
    }

    document.getElementById('menu-search').addEventListener('input', render);

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeType = btn.dataset.type;
        render();
      });
    });
  </script>

  </div>
</body>
</html>
