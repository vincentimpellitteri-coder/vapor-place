<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Juice Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── Reset & Tokens ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:       #0a0a12;
      --surface:  #13131f;
      --elevated: #1c1c2e;
      --border:   #2a2a40;
      --purple:   #7b5ea7;
      --purple-l: #9b78d0;
      --cyan:     #38bdf8;
      --gold:     #f59e0b;
      --text:     #e2e8f0;
      --muted:    #94a3b8;
      --danger:   #ef4444;
      --success:  #22c55e;

      --cat-fruit:    #10b981;
      --cat-candy:    #ec4899;
      --cat-dessert:  #f59e0b;
      --cat-cereal:   #fcd34d;
      --cat-coffee:   #b45309;
      --cat-menthol:  #38bdf8;
      --cat-tobacco:  #a78bfa;
      --cat-beverage: #fb923c;

      --font-head: 'Bebas Neue', sans-serif;
      --font-body: 'DM Sans', sans-serif;
      --radius: 10px;
      --shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 15px; }
    button { cursor: pointer; font-family: var(--font-body); }
    input, select, textarea { font-family: var(--font-body); }
    a { color: inherit; text-decoration: none; }

    /* ── Layout ─────────────────────────────────────────────── */
    #customer-view { min-height: 100vh; display: flex; flex-direction: column; }
    #admin-view    { min-height: 100vh; display: flex; flex-direction: column; }
    .hidden { display: none !important; }

    /* ── Shop Header ─────────────────────────────────────────── */
    #shop-header {
      background: var(--surface);
      border-bottom: 2px solid var(--purple);
      padding: 18px 24px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    #shop-name {
      font-family: var(--font-head);
      font-size: 2.4rem;
      letter-spacing: 0.04em;
      background: linear-gradient(135deg, var(--purple-l), var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }
    .shop-meta { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
    .shop-meta span { font-size: 0.82rem; color: var(--muted); letter-spacing: 0.02em; }
    .shop-meta span::before { margin-right: 4px; }
    .shop-meta .addr::before { content: '📍'; }
    .shop-meta .phone::before { content: '📞'; }

    /* ── Search Bar ──────────────────────────────────────────── */
    #search-wrap {
      background: var(--surface);
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #search-input {
      flex: 1;
      background: var(--elevated);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      padding: 9px 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    #search-input:focus { border-color: var(--cyan); }
    #search-clear {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.2rem;
      padding: 4px 8px;
      border-radius: 6px;
      transition: color 0.2s;
    }
    #search-clear:hover { color: var(--text); }

    /* ── Tab Bar ─────────────────────────────────────────────── */
    #tab-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 0;
      padding: 0 12px;
      overflow-x: auto;
    }
    .tab-btn {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: var(--muted);
      font-family: var(--font-head);
      font-size: 1.05rem;
      letter-spacing: 0.06em;
      padding: 14px 20px 11px;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--purple-l); border-bottom-color: var(--purple); }

    /* ── Main Content ────────────────────────────────────────── */
    #tab-content { flex: 1; padding: 20px; overflow-y: auto; }

    /* ── Flavor Chips ────────────────────────────────────────── */
    #flavor-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .chip {
      background: var(--elevated);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 14px;
      transition: all 0.2s;
    }
    .chip:hover { border-color: var(--purple); color: var(--text); }
    .chip.active { background: var(--purple); border-color: var(--purple); color: #fff; }
    .chip.cat-fruit.active    { background: var(--cat-fruit);    border-color: var(--cat-fruit); }
    .chip.cat-candy.active    { background: var(--cat-candy);    border-color: var(--cat-candy); }
    .chip.cat-dessert.active  { background: var(--cat-dessert);  border-color: var(--cat-dessert); color: #111; }
    .chip.cat-cereal.active   { background: var(--cat-cereal);   border-color: var(--cat-cereal); color: #111; }
    .chip.cat-coffee.active   { background: var(--cat-coffee);   border-color: var(--cat-coffee); }
    .chip.cat-menthol.active  { background: var(--cat-menthol);  border-color: var(--cat-menthol); color: #111; }
    .chip.cat-tobacco.active  { background: var(--cat-tobacco);  border-color: var(--cat-tobacco); }
    .chip.cat-beverage.active { background: var(--cat-beverage); border-color: var(--cat-beverage); color: #111; }

    /* ── Product Grid ────────────────────────────────────────── */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
    }

    /* ── Product Card ────────────────────────────────────────── */
    .product-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.2s, transform 0.15s;
      position: relative;
    }
    .product-card:hover { border-color: var(--purple); transform: translateY(-2px); }
    .card-img { width: 100%; max-height: 180px; object-fit: contain; background: #111; display: block; }
    .card-stripe { height: 4px; width: 100%; flex-shrink: 0; }
    .card-body { padding: 14px 14px 12px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .card-name { font-size: 1rem; font-weight: 700; color: var(--text); line-height: 1.25; }
    .card-brand { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
    .cat-emoji { font-size: 1.3rem; flex-shrink: 0; }
    .card-notes { font-size: 0.78rem; color: var(--muted); line-height: 1.4; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; margin-top: 8px; padding-top: 10px; border-top: 1px solid var(--border); }
    .card-price { font-family: var(--font-head); font-size: 1.3rem; letter-spacing: 0.04em; color: var(--cyan); }
    .card-badges { display: flex; gap: 4px; flex-wrap: wrap; }
    .badge {
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .badge-salt    { background: rgba(16,185,129,0.15); color: #10b981; }
    .badge-sub     { background: rgba(251,146,60,0.15);  color: #fb923c; }
    .badge-disp    { background: rgba(56,189,248,0.15);  color: #38bdf8; }
    .badge-deal    { background: rgba(245,158,11,0.2);   color: var(--gold); }
    .badge-top10   { background: rgba(123,94,167,0.2);   color: var(--purple-l); }
    .card-nic { font-size: 0.75rem; color: var(--muted); }
    .card-size-vg { font-size: 0.72rem; color: var(--border); color: #4a5568; }
    .top10-num {
      position: absolute;
      top: 12px; right: 12px;
      font-family: var(--font-head);
      font-size: 1.6rem;
      color: var(--purple);
      opacity: 0.5;
      line-height: 1;
    }

    /* ── Brand Grid ──────────────────────────────────────────── */
    .brand-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
    }
    .brand-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .brand-card:hover { border-color: var(--purple); background: var(--elevated); }
    .brand-card-name { font-family: var(--font-head); font-size: 1.2rem; letter-spacing: 0.05em; color: var(--text); margin-bottom: 6px; }
    .brand-card-count { font-size: 0.78rem; color: var(--muted); }

    /* ── Brand Drill-in ──────────────────────────────────────── */
    #brand-back-bar { margin-bottom: 16px; }
    .back-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--cyan);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 8px 16px;
      letter-spacing: 0.04em;
      transition: all 0.2s;
    }
    .back-btn:hover { background: rgba(56,189,248,0.08); }
    #brand-drill-title { font-family: var(--font-head); font-size: 1.8rem; letter-spacing: 0.04em; margin-bottom: 16px; color: var(--purple-l); }

    /* ── Top 10 ──────────────────────────────────────────────── */
    #top10-header { margin-bottom: 20px; }
    #top10-header h2 { font-family: var(--font-head); font-size: 1.8rem; letter-spacing: 0.04em; color: var(--purple-l); }
    #top10-header p { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }

    /* ── Deals ───────────────────────────────────────────────── */
    #deals-header { margin-bottom: 20px; }
    #deals-header h2 { font-family: var(--font-head); font-size: 1.8rem; letter-spacing: 0.04em; color: var(--gold); }
    #deals-header p { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }
    .deal-note-strip {
      font-size: 0.75rem;
      color: var(--gold);
      background: rgba(245,158,11,0.1);
      border-radius: 4px;
      padding: 3px 8px;
      margin-top: 4px;
      display: inline-block;
    }

    /* ── Empty State ─────────────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty-state .empty-icon { font-size: 3rem; margin-bottom: 12px; }
    .empty-state p { font-size: 1rem; }

    /* ── Search Results ──────────────────────────────────────── */
    #search-results-view { padding-top: 0; }
    #search-results-title { font-family: var(--font-head); font-size: 1.4rem; letter-spacing: 0.04em; color: var(--muted); margin-bottom: 16px; }

    /* ── Gear Button ─────────────────────────────────────────── */
    #gear-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--elevated);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 1.2rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
      transition: all 0.2s;
      z-index: 50;
    }
    #gear-btn:hover { color: var(--text); border-color: var(--purple); }

    /* ── Admin Gate ──────────────────────────────────────────── */
    #admin-gate {
      position: fixed;
      inset: 0;
      background: rgba(10,10,18,0.9);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }
    .gate-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 36px 32px;
      width: 340px;
      box-shadow: var(--shadow);
    }
    .gate-card h2 { font-family: var(--font-head); font-size: 1.8rem; letter-spacing: 0.05em; color: var(--purple-l); margin-bottom: 6px; }
    .gate-card p { font-size: 0.83rem; color: var(--muted); margin-bottom: 24px; }
    .gate-card input {
      width: 100%;
      background: var(--elevated);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      padding: 10px 14px;
      margin-bottom: 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    .gate-card input:focus { border-color: var(--purple); }
    .gate-error { font-size: 0.8rem; color: var(--danger); margin-bottom: 10px; min-height: 18px; }
    @keyframes shake {
      0%,100%{transform:translateX(0)}
      20%,60%{transform:translateX(-8px)}
      40%,80%{transform:translateX(8px)}
    }
    .shake { animation: shake 0.35s ease; }
    .gate-btns { display: flex; gap: 10px; margin-top: 4px; }

    /* ── Buttons ─────────────────────────────────────────────── */
    .btn {
      border: none;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 10px 18px;
      transition: all 0.2s;
      letter-spacing: 0.02em;
    }
    .btn-primary { background: var(--purple); color: #fff; }
    .btn-primary:hover { background: var(--purple-l); }
    .btn-secondary { background: var(--elevated); border: 1px solid var(--border); color: var(--text); }
    .btn-secondary:hover { border-color: var(--purple); }
    .btn-danger { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: var(--danger); }
    .btn-danger:hover { background: rgba(239,68,68,0.25); }
    .btn-sm { padding: 6px 12px; font-size: 0.78rem; }
    .btn-full { width: 100%; }
    .btn-icon { background: none; border: none; font-size: 1rem; padding: 4px 6px; border-radius: 6px; transition: background 0.2s; }
    .btn-icon:hover { background: var(--elevated); }

    /* ── Admin Layout ────────────────────────────────────────── */
    #admin-header {
      background: var(--surface);
      border-bottom: 2px solid var(--purple);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #admin-header h1 { font-family: var(--font-head); font-size: 1.6rem; letter-spacing: 0.06em; color: var(--purple-l); }
    #admin-body { display: flex; flex: 1; overflow: hidden; }
    #admin-nav {
      width: 200px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 16px 0;
      flex-shrink: 0;
    }
    .admin-nav-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      background: none;
      border: none;
      border-left: 3px solid transparent;
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 600;
      padding: 12px 20px;
      text-align: left;
      transition: all 0.2s;
    }
    .admin-nav-btn:hover { color: var(--text); background: var(--elevated); }
    .admin-nav-btn.active { color: var(--purple-l); border-left-color: var(--purple); background: rgba(123,94,167,0.08); }
    #admin-content { flex: 1; padding: 24px; overflow-y: auto; }
    .admin-panel { display: none; }
    .admin-panel.active { display: block; }
    .panel-title { font-family: var(--font-head); font-size: 1.6rem; letter-spacing: 0.05em; color: var(--text); margin-bottom: 20px; }

    /* ── Form Styles ─────────────────────────────────────────── */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full { grid-column: 1 / -1; }
    .form-label { font-size: 0.78rem; font-weight: 600; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; }
    .form-input {
      background: var(--elevated);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.92rem;
      padding: 9px 12px;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
    }
    .form-input:focus { border-color: var(--purple); }
    select.form-input option { background: var(--elevated); }
    .form-check { display: flex; align-items: center; gap: 10px; padding: 10px 0; }
    .form-check input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--purple); cursor: pointer; }
    .form-check label { font-size: 0.88rem; color: var(--text); cursor: pointer; }
    .form-actions { margin-top: 20px; display: flex; gap: 10px; }
    .settings-section { margin-bottom: 28px; }
    .settings-section h3 { font-size: 0.85rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 14px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }

    /* ── Products Table ──────────────────────────────────────── */
    .products-table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th {
      background: var(--elevated);
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      padding: 10px 12px;
      text-align: left;
      white-space: nowrap;
    }
    td { padding: 11px 12px; border-bottom: 1px solid var(--border); font-size: 0.88rem; vertical-align: middle; }
    tr:hover td { background: rgba(123,94,167,0.05); }
    .tbl-name { font-weight: 600; color: var(--text); }
    .tbl-brand { color: var(--muted); font-size: 0.8rem; }
    .tbl-actions { display: flex; gap: 6px; align-items: center; }
    .toggle-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.88rem;
      padding: 4px 8px;
      transition: all 0.2s;
      color: var(--muted);
    }
    .toggle-btn.on-deal  { background: rgba(245,158,11,0.15); border-color: var(--gold); color: var(--gold); }
    .toggle-btn.on-top10 { background: rgba(123,94,167,0.15); border-color: var(--purple); color: var(--purple-l); }

    /* ── Stats Cards ─────────────────────────────────────────── */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 16px;
      text-align: center;
    }
    .stat-num { font-family: var(--font-head); font-size: 2.2rem; letter-spacing: 0.04em; color: var(--purple-l); line-height: 1; margin-bottom: 6px; }
    .stat-label { font-size: 0.76rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }

    /* ── Toast ───────────────────────────────────────────────── */
    #toast-container { position: fixed; bottom: 76px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 300; pointer-events: none; }
    .toast {
      background: var(--elevated);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 0.85rem;
      color: var(--text);
      box-shadow: var(--shadow);
      animation: toastIn 0.25s ease;
      max-width: 260px;
    }
    .toast.success { border-color: var(--success); color: var(--success); }
    .toast.danger  { border-color: var(--danger);  color: var(--danger); }
    @keyframes toastIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
  </style>
</head>
<body>

<!-- ═══════════════ CUSTOMER VIEW ═══════════════ -->
<div id="customer-view">
  <header id="shop-header">
    <div id="shop-name">E-Juice Finder</div>
    <div class="shop-meta">
      <span class="addr" id="header-addr"></span>
      <span class="phone" id="header-phone"></span>
    </div>
  </header>

  <div id="search-wrap">
    <input id="search-input" type="text" placeholder="Search by name, brand, or flavor…" autocomplete="off" spellcheck="false">
    <button id="search-clear" title="Clear">✕</button>
  </div>

  <nav id="tab-bar">
    <button class="tab-btn active" data-tab="flavor">🍓 Flavor</button>
    <button class="tab-btn" data-tab="brand">🏷 Brand</button>
    <button class="tab-btn" data-tab="top10">⭐ Top 10</button>
    <button class="tab-btn" data-tab="deals">🔥 Deals</button>
  </nav>

  <main id="tab-content">

    <!-- SEARCH RESULTS (shown on top of any tab) -->
    <div id="search-results-view" class="hidden">
      <div id="search-results-title"></div>
      <div id="search-results-grid" class="product-grid"></div>
    </div>

    <!-- FLAVOR TAB -->
    <div id="flavor-view">
      <div id="flavor-chips"></div>
      <div id="flavor-grid" class="product-grid"></div>
    </div>

    <!-- BRAND TAB -->
    <div id="brand-view" class="hidden">
      <div id="brand-grid-wrap">
        <div id="brand-grid" class="brand-grid"></div>
      </div>
      <div id="brand-drill" class="hidden">
        <div id="brand-back-bar">
          <button class="back-btn" id="brand-back-btn">← Back to Brands</button>
        </div>
        <div id="brand-drill-title"></div>
        <div id="brand-drill-grid" class="product-grid"></div>
      </div>
    </div>

    <!-- TOP 10 TAB -->
    <div id="top10-view" class="hidden">
      <div id="top10-header">

function loadProducts() {
  try { return JSON.parse(localStorage.getItem(LS_PRODUCTS)) || []; }
  catch(e) { return []; }
}
function saveProducts(p) { localStorage.setItem(LS_PRODUCTS, JSON.stringify(p)); }

function getShop() {
  try { return JSON.parse(localStorage.getItem(LS_SHOP)) || { name: 'E-Juice Finder', address: '', phone: '' }; }
  catch(e) { return { name: 'E-Juice Finder', address: '', phone: '' }; }
}
function saveShop(s) { localStorage.setItem(LS_SHOP, JSON.stringify(s)); }

function getPassword() { return localStorage.getItem(LS_PW) || 'vape123'; }
function savePassword(p) { localStorage.setItem(LS_PW, p); }

function genId() { return crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2); }

// ── Seed Data ─────────────────────────────────────────────
function seedIfEmpty() {
  if (loadProducts().length) return;
  const seed = [
    { id: genId(), name: 'Lava Flow', brand: 'Naked 100', category: 'Fruit', flavorNotes: 'Strawberry, Coconut, Pineapple', type: 'SALT', size: '60ml', nicotine: '25mg / 50mg', vgpg: '50VG/50PG', price: 15.99, isDeal: false, dealNote: '', isTop10: true, image: '', notes: '' },

    { id: genId(), name: 'Mango Strawberry', brand: 'Juice Head', category: 'Beverage', flavorNotes: 'Mango, Strawberry, Tropical, Juice', type: 'SALT', size: '100ml', nicotine: '25mg / 50mg', vgpg: '70VG/30PG', price: 19.99, isDeal: false, dealNote: '', isTop10: true, image: '', notes: '' },
    { id: genId(), name: 'Fuji Pear Mangoberry', brand: 'MRKT PLCE', category: 'Fruit', flavorNotes: 'Fuji Apple, Pear, Mango, Berries', type: 'SALT', size: '30ml', nicotine: '25mg / 50mg', vgpg: '70VG/30PG', price: 0, isDeal: false, dealNote: '', isTop10: false, image: '', notes: '' },
    { id: genId(), name: 'Fuji Pear Mangoberry', brand: 'MRKT PLCE', category: 'Fruit', flavorNotes: 'Fuji Apple, Pear, Mango, Berries', type: 'SUB', size: '100ml', nicotine: '0mg / 3mg / 6mg', vgpg: '70VG/30PG', price: 0, isDeal: false, dealNote: '', isTop10: false, image: '', notes: '' },
    { id: genId(), name: 'Forbidden Berry', brand: 'MRKT PLCE', category: 'Fruit', flavorNotes: 'Tropical Fruit, Mixed Berries, Strawberry, Raspberry, Blackberry', type: 'SALT', size: '30ml', nicotine: '24mg / 48mg', vgpg: '70VG/30PG', price: 0, isDeal: false, dealNote: '', isTop10: false, image: 'mrkt-plce-forbidden-berry.jpg', notes: '' },

    { id: genId(), name: 'Iced Forbidden Berry', brand: 'MRKT PLCE', category: 'Menthol/Ice', flavorNotes: 'Tropical Fruit, Mixed Berries, Ice, Menthol', type: 'SALT', size: '30ml', nicotine: '24mg / 48mg', vgpg: '70VG/30PG', price: 0, isDeal: false, dealNote: '', isTop10: false, image: 'mrkt-plce-iced-forbidden-berry.jpg', notes: '' },
    { id: genId(), name: 'Iced Forbidden Berry', brand: 'MRKT PLCE', category: 'Menthol/Ice', flavorNotes: 'Tropical Fruit, Mixed Berries, Ice, Menthol', type: 'SUB', size: '100ml', nicotine: '0mg / 3mg / 6mg', vgpg: '70VG/30PG', price: 0, isDeal: false, dealNote: '', isTop10: false, image: 'mrkt-plce-iced-forbidden-berry.jpg', notes: '' },
  ];
  saveProducts(seed);
}

// ══════════════════════════════════════════════════════════
// RENDER HELPERS
// ══════════════════════════════════════════════════════════

function catColor(cat) { return (CAT_META[cat] || {}).color || '#7b5ea7'; }
function catEmoji(cat) { return (CAT_META[cat] || {}).emoji || '🍬'; }
function catCls(cat)   { return (CAT_META[cat] || {}).cls   || ''; }

function typeBadge(type) {
  const map = { SALT: 'badge-salt', SUB: 'badge-sub', DISP: 'badge-disp' };
  const label = { SALT: 'Salt Nic', SUB: 'Sub-Ohm', DISP: 'Disposable' };
  return `<span class="badge ${map[type] || ''}">${label[type] || type}</span>`;
}

function productCard(p, opts = {}) {
  const cat = CAT_META[p.category] || { color: '#7b5ea7', emoji: '🍬' };
  const priceStr = p.price ? `$${parseFloat(p.price).toFixed(2)}` : '';
  const dealBadge = p.isDeal ? `<span class="badge badge-deal">Deal</span>` : '';
  const top10Badge = p.isTop10 ? `<span class="badge badge-top10">★ Top 10</span>` : '';
  const top10Num = opts.rank ? `<div class="top10-num">${opts.rank}</div>` : '';
  const dealNoteEl = (p.isDeal && p.dealNote) ? `<div class="deal-note-strip">${esc(p.dealNote)}</div>` : '';
  return `
    <div class="product-card">
      ${top10Num}
      ${p.image ? `<img class="card-img" src="images/${esc(p.image)}" alt="${esc(p.name)}" loading="lazy">` : ''}
      <div class="card-stripe" style="background:${cat.color};"></div>
      <div class="card-body">
        <div class="card-top">
          <div>
            <div class="card-name">${esc(p.name)}</div>
            <div class="card-brand">${esc(p.brand)}</div>
          </div>
          <div class="cat-emoji">${cat.emoji}</div>
        </div>
        ${p.flavorNotes ? `<div class="card-notes">${esc(p.flavorNotes)}</div>` : ''}
        ${dealNoteEl}
        <div class="card-footer">
          <div class="card-price">${priceStr}</div>
          <div class="card-badges">
            ${typeBadge(p.type)}${dealBadge}${top10Badge}
          </div>
        </div>
        ${p.nicotine ? `<div class="card-nic">Nicotine: ${esc(p.nicotine)}</div>` : ''}
        ${(p.size || p.vgpg) ? `<div class="card-size-vg">${[p.size, p.vgpg].filter(Boolean).map(esc).join(' · ')}</div>` : ''}
      </div>
    </div>`;
}

function emptyState(icon, msg) {
  return `<div class="empty-state"><div class="empty-icon">${icon}</div><p>${msg}</p></div>`;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ══════════════════════════════════════════════════════════
// CUSTOMER VIEW
// ══════════════════════════════════════════════════════════

function renderShopHeader() {
  const shop = getShop();
  document.getElementById('shop-name').textContent = shop.name || 'E-Juice Finder';
  document.getElementById('header-addr').textContent = shop.address || '';
  document.getElementById('header-phone').textContent = shop.phone || '';
}

// ── Flavor Tab ─────────────────────────────────────────────
let activeCategory = 'All';

function renderFlavorChips() {
  const chips = document.getElementById('flavor-chips');
  const cats = ['All', ...Object.keys(CAT_META)];
  chips.innerHTML = cats.map(c => {
    const cls = c === 'All' ? '' : catCls(c);
    const active = activeCategory === c ? 'active' : '';
    const emoji = c === 'All' ? '' : catEmoji(c) + ' ';
    return `<button class="chip ${cls} ${active}" data-cat="${esc(c)}">${emoji}${esc(c)}</button>`;
  }).join('');
  chips.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => {
      activeCategory = btn.dataset.cat;
      renderFlavorChips();
      renderFlavorGrid();
    });
  });
}

function renderFlavorGrid() {
  const grid = document.getElementById('flavor-grid');
  let products = loadProducts();
  if (activeCategory !== 'All') products = products.filter(p => p.category === activeCategory);
  if (!products.length) {
    grid.innerHTML = emptyState('🔍', activeCategory === 'All' ? 'No products yet.' : `No ${activeCategory} products yet.`);
    return;
  }
  grid.innerHTML = products.map(p => productCard(p)).join('');
}

// ── Brand Tab ──────────────────────────────────────────────
let activeBrand = null;

function renderBrandGrid() {
  const products = loadProducts();
  const brandMap = {};
  products.forEach(p => { brandMap[p.brand] = (brandMap[p.brand] || 0) + 1; });
  const brands = Object.entries(brandMap).sort((a,b) => a[0].localeCompare(b[0]));
  const grid = document.getElementById('brand-grid');
  if (!brands.length) {
    grid.innerHTML = emptyState('🏷', 'No brands yet.');
    return;
  }
  grid.innerHTML = brands.map(([brand, count]) =>
    `<div class="brand-card" data-brand="${esc(brand)}">
      <div class="brand-card-name">${esc(brand)}</div>
      <div class="brand-card-count">${count} product${count !== 1 ? 's' : ''}</div>
    </div>`
  ).join('');
  grid.querySelectorAll('.brand-card').forEach(card => {
    card.addEventListener('click', () => openBrandDrill(card.dataset.brand));
  });
}

function openBrandDrill(brand) {
  activeBrand = brand;
  document.getElementById('brand-grid-wrap').classList.add('hidden');
  const drill = document.getElementById('brand-drill');
  drill.classList.remove('hidden');
  document.getElementById('brand-drill-title').textContent = brand;
  const products = loadProducts().filter(p => p.brand === brand);
  const grid = document.getElementById('brand-drill-grid');
  grid.innerHTML = products.length ? products.map(p => productCard(p)).join('') : emptyState('📦', 'No products for this brand.');
}

function closeBrandDrill() {
  activeBrand = null;
  document.getElementById('brand-drill').classList.add('hidden');
  document.getElementById('brand-grid-wrap').classList.remove('hidden');
}

// ── Top 10 Tab ─────────────────────────────────────────────
function renderTop10() {
  const products = loadProducts().filter(p => p.isTop10).slice(0, 10);
  const grid = document.getElementById('top10-grid');
  grid.innerHTML = products.length
    ? products.map((p, i) => productCard(p, { rank: i + 1 })).join('')
    : emptyState('⭐', 'No Top 10 items pinned yet. Add them from the Admin panel.');
}

// ── Deals Tab ──────────────────────────────────────────────
function renderDeals() {
  const products = loadProducts().filter(p => p.isDeal);
  const grid = document.getElementById('deals-grid');
  grid.innerHTML = products.length
    ? products.map(p => productCard(p)).join('')
    : emptyState('🔥', 'No deals right now — check back soon!');
}

// ── Tab Switching ──────────────────────────────────────────
let activeTab = 'flavor';
const tabViews = { flavor: 'flavor-view', brand: 'brand-view', top10: 'top10-view', deals: 'deals-view' };

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  Object.entries(tabViews).forEach(([t, id]) => document.getElementById(id).classList.toggle('hidden', t !== tab));
  clearSearch();
  if (tab === 'flavor') { renderFlavorChips(); renderFlavorGrid(); }
  if (tab === 'brand')  { closeBrandDrill(); renderBrandGrid(); }
  if (tab === 'top10')  renderTop10();
  if (tab === 'deals')  renderDeals();
}

// ── Search ─────────────────────────────────────────────────
let searchActive = false;

function doSearch(q) {
  if (!q.trim()) { clearSearch(); return; }
  searchActive = true;
  Object.values(tabViews).forEach(id => document.getElementById(id).classList.add('hidden'));
  const resultsView = document.getElementById('search-results-view');
  resultsView.classList.remove('hidden');
  const lower = q.toLowerCase();
  const matches = loadProducts().filter(p =>
    p.name.toLowerCase().includes(lower) ||
    p.brand.toLowerCase().includes(lower) ||
    (p.flavorNotes || '').toLowerCase().includes(lower) ||
    (p.category || '').toLowerCase().includes(lower)
  );
  document.getElementById('search-results-title').textContent = `${matches.length} result${matches.length !== 1 ? 's' : ''} for "${q}"`;
  document.getElementById('search-results-grid').innerHTML = matches.length
    ? matches.map(p => productCard(p)).join('')
    : emptyState('🔍', 'No products match your search.');
}

function clearSearch() {
  searchActive = false;
  document.getElementById('search-input').value = '';
  document.getElementById('search-results-view').classList.add('hidden');
  document.getElementById(tabViews[activeTab]).classList.remove('hidden');
}

// ══════════════════════════════════════════════════════════
// ADMIN VIEW
// ══════════════════════════════════════════════════════════

function openAdmin() {
  if (sessionStorage.getItem('ejfAuth') === '1') {
    showAdmin();
  } else {
    document.getElementById('admin-gate').classList.remove('hidden');
    document.getElementById('gate-pw-input').value = '';
    document.getElementById('gate-error').textContent = '';
    setTimeout(() => document.getElementById('gate-pw-input').focus(), 50);
  }
}

function showAdmin() {
  document.getElementById('customer-view').classList.add('hidden');
  document.getElementById('admin-gate').classList.add('hidden');
  document.getElementById('admin-view').classList.remove('hidden');
  document.getElementById('gear-btn').classList.add('hidden');
  prefillSettings();
  renderAdminProducts();
  renderStats();
}

function closeAdmin() {
  document.getElementById('admin-view').classList.add('hidden');
  document.getElementById('customer-view').classList.remove('hidden');
  document.getElementById('gear-btn').classList.remove('hidden');
  switchTab(activeTab);
}

function logoutAdmin() {
  sessionStorage.removeItem('ejfAuth');
  closeAdmin();
}

// ── Admin Panels ───────────────────────────────────────────
function switchAdminPanel(panel) {
  document.querySelectorAll('.admin-nav-btn').forEach(b => b.classList.toggle('active', b.dataset.panel === panel));
  document.querySelectorAll('.admin-panel').forEach(p => p.classList.toggle('active', p.id === `panel-${panel}`));
  if (panel === 'products') renderAdminProducts();
  if (panel === 'stats')    renderStats();
}

// ── Settings ───────────────────────────────────────────────
function prefillSettings() {
  const shop = getShop();
  document.getElementById('set-name').value  = shop.name    || '';
  document.getElementById('set-addr').value  = shop.address || '';
  document.getElementById('set-phone').value = shop.phone   || '';
}

// ── Admin Products Table ───────────────────────────────────
function renderAdminProducts(filter = '') {
  let products = loadProducts();
  if (filter) {
    const q = filter.toLowerCase();
    products = products.filter(p =>
      p.name.toLowerCase().includes(q) ||
      p.brand.toLowerCase().includes(q) ||
      (p.category || '').toLowerCase().includes(q)
    );
  }
  const tbody = document.getElementById('products-tbody');
  if (!products.length) {
    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:30px;">No products found.</td></tr>`;
    return;
  }
  tbody.innerHTML = products.map(p => {
    const catMeta = CAT_META[p.category] || {};
    return `
      <tr>
        <td><div class="tbl-name">${esc(p.name)}</div></td>
        <td class="tbl-brand">${esc(p.brand)}</td>
        <td><span style="color:${catMeta.color||'#7b5ea7'};font-size:0.82rem;">${catMeta.emoji||''} ${esc(p.category||'')}</span></td>
        <td>${typeBadge(p.type)}</td>
        <td>${p.price ? `$${parseFloat(p.price).toFixed(2)}` : '—'}</td>
        <td>
          <div class="tbl-actions">
            <button class="toggle-btn ${p.isDeal?'on-deal':''}" data-id="${p.id}" data-action="deal" title="Toggle Deal">🏷</button>
            <button class="toggle-btn ${p.isTop10?'on-top10':''}" data-id="${p.id}" data-action="top10" title="Toggle Top 10">⭐</button>
            <button class="btn btn-danger btn-sm btn-icon" data-id="${p.id}" data-action="delete" title="Delete">🗑</button>
          </div>
        </td>
      </tr>`;
  }).join('');
}

// ── Stats ──────────────────────────────────────────────────
function renderStats() {
  const products = loadProducts();
  const brands = new Set(products.map(p => p.brand)).size;
  const cats   = new Set(products.map(p => p.category).filter(Boolean)).size;
  const deals  = products.filter(p => p.isDeal).length;
  const top10  = products.filter(p => p.isTop10).length;
  document.getElementById('stats-grid').innerHTML = [
    { num: products.length, label: 'Total Products' },
    { num: brands,          label: 'Brands' },
    { num: cats,            label: 'Categories' },
    { num: deals,           label: 'Active Deals' },
    { num: top10,           label: 'Top 10 Pins' },
  ].map(s => `<div class="stat-card"><div class="stat-num">${s.num}</div><div class="stat-label">${s.label}</div></div>`).join('');
}

// ── Toast ──────────────────────────────────────────────────
function toast(msg, type = 'success') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 2200);
}

// ══════════════════════════════════════════════════════════
// EVENT WIRING
// ══════════════════════════════════════════════════════════

// Tabs
document.querySelectorAll('.tab-btn').forEach(btn =>
  btn.addEventListener('click', () => switchTab(btn.dataset.tab))
);

// Search
document.getElementById('search-input').addEventListener('input', e => doSearch(e.target.value));
document.getElementById('search-clear').addEventListener('click', clearSearch);

// Brand back
document.getElementById('brand-back-btn').addEventListener('click', closeBrandDrill);

// Gear / Admin gate
document.getElementById('gear-btn').addEventListener('click', openAdmin);
document.getElementById('gate-cancel-btn').addEventListener('click', () => {
  document.getElementById('admin-gate').classList.add('hidden');
});

document.getElementById('gate-submit-btn').addEventListener('click', () => {
  const pw = document.getElementById('gate-pw-input').value;
  if (pw === getPassword()) {
    sessionStorage.setItem('ejfAuth', '1');
    showAdmin();
  } else {
    document.getElementById('gate-error').textContent = 'Incorrect password.';
    const card = document.getElementById('gate-card');
    card.classList.remove('shake');
    void card.offsetWidth;
    card.classList.add('shake');
  }
});

document.getElementById('gate-pw-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('gate-submit-btn').click();
});

// Admin nav
document.querySelectorAll('.admin-nav-btn').forEach(btn =>
  btn.addEventListener('click', () => switchAdminPanel(btn.dataset.panel))
);

// Admin preview / logout
document.getElementById('admin-preview-btn').addEventListener('click', closeAdmin);
document.getElementById('admin-logout-btn').addEventListener('click', logoutAdmin);

// Save shop info
document.getElementById('save-shop-btn').addEventListener('click', () => {
  saveShop({
    name:    document.getElementById('set-name').value.trim(),
    address: document.getElementById('set-addr').value.trim(),
    phone:   document.getElementById('set-phone').value.trim(),
  });
  renderShopHeader();
  toast('Shop info saved!');
});

// Change password
document.getElementById('save-pw-btn').addEventListener('click', () => {
  const np = document.getElementById('set-pw-new').value;
  const cp = document.getElementById('set-pw-confirm').value;
  if (!np) { toast('Enter a new password.', 'danger'); return; }
  if (np !== cp) { toast('Passwords do not match.', 'danger'); return; }
  savePassword(np);
  document.getElementById('set-pw-new').value = '';
  document.getElementById('set-pw-confirm').value = '';
  toast('Password updated!');
});

// Add product form
document.getElementById('add-product-form').addEventListener('submit', e => {
  e.preventDefault();
  const products = loadProducts();
  const p = {
    id:          genId(),
    name:        document.getElementById('f-name').value.trim(),
    brand:       document.getElementById('f-brand').value.trim(),
    category:    document.getElementById('f-category').value,
    flavorNotes: document.getElementById('f-notes').value.trim(),
    type:        document.getElementById('f-type').value,
    size:        document.getElementById('f-size').value.trim(),
    nicotine:    document.getElementById('f-nic').value.trim(),
    vgpg:        document.getElementById('f-vgpg').value.trim(),
    price:       parseFloat(document.getElementById('f-price').value) || 0,
    isDeal:      document.getElementById('f-deal').checked,
    dealNote:    document.getElementById('f-deal-note').value.trim(),
    isTop10:     document.getElementById('f-top10').checked,
    image:       document.getElementById('f-image').value.trim(),
    notes:       document.getElementById('f-internal').value.trim(),
  };
  products.push(p);
  saveProducts(products);
  e.target.reset();
  toast(`"${p.name}" added!`);
});

// Products table actions (event delegation)
document.getElementById('products-tbody').addEventListener('click', e => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const { id, action } = btn.dataset;
  const products = loadProducts();
  const idx = products.findIndex(p => p.id === id);
  if (idx === -1) return;

  if (action === 'delete') {
    const name = products[idx].name;
    products.splice(idx, 1);
    saveProducts(products);
    renderAdminProducts(document.getElementById('admin-search').value);
    renderStats();
    toast(`"${name}" deleted.`, 'danger');
  } else if (action === 'deal') {
    products[idx].isDeal = !products[idx].isDeal;
    saveProducts(products);
    renderAdminProducts(document.getElementById('admin-search').value);
    toast(products[idx].isDeal ? 'Marked as deal.' : 'Deal removed.');
  } else if (action === 'top10') {
    products[idx].isTop10 = !products[idx].isTop10;
    saveProducts(products);
    renderAdminProducts(document.getElementById('admin-search').value);
    renderStats();
    toast(products[idx].isTop10 ? 'Pinned to Top 10.' : 'Unpinned from Top 10.');
  }
});

// Admin search filter
document.getElementById('admin-search').addEventListener('input', e => {
  renderAdminProducts(e.target.value);
});

// ══════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════
seedIfEmpty();
renderShopHeader();
switchTab('flavor');
</script>
</body>
</html>
