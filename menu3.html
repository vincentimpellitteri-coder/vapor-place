<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu #3 — The Vapor Place</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body#inner-page { background: #fff !important; color: #111 !important; }
    #inner-page main { background: #fff; }
    #inner-page footer { background: #f0f0f0; color: #555; border-top: 1px solid #ddd; }
    #menu-count { color: #555 !important; }
    #no-results { color: #555 !important; }
    .menu-controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      background: #fff;
      padding: 12px 0;
      margin-bottom: 16px;
      border-bottom: 1px solid #ddd;
    }
    #menu-search {
      flex: 1;
      min-width: 200px;
      background: #f5f5f5;
      border: 1px solid #ccc;
      border-radius: 8px;
      color: #111;
      font-family: 'Rajdhani', sans-serif;
      font-size: 1rem;
      padding: 10px 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    #menu-search:focus { border-color: #0088aa; }
    .filter-btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-btn {
      background: transparent;
      border: 1px solid #bbb;
      border-radius: 6px;
      color: #555;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 8px 14px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    .filter-btn:hover, .filter-btn.active {
      border-color: #0088aa;
      color: #0088aa;
      background: rgba(0,136,170,0.06);
    }
    #menu-count { color: #555; font-size: 0.85rem; margin-bottom: 16px; }
    .menu-list { display: flex; flex-direction: column; gap: 12px; }
    .menu-item {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 14px 16px;
      transition: border-color 0.2s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .menu-item:hover { border-color: #0088aa88; }
    .menu-item-name { font-size: 1.19rem; color: #111; font-weight: 600; }
    .menu-item-type {
      display: inline-block;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.55rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 2px 7px;
      border-radius: 4px;
      margin-right: 4px;
      text-transform: uppercase;
    }
    .type-DISP { background: rgba(0,136,170,0.12); color: #0088aa; }
    .type-SALT { background: rgba(100,160,0,0.12); color: #4a8000; }
    .type-SUB  { background: rgba(200,100,0,0.12); color: #b85a00; }
    .type-KIT  { background: rgba(150,50,200,0.12); color: #7a00cc; }
    #no-results { display:none; text-align:center; color:#555; padding:60px 0; font-size:1rem; }
  </style>
</head>
<body id="inner-page">
<div style="position:relative;z-index:1;">

  <header>
    <div class="header-inner">
      <a href="home.html" class="logo-link">
        <img src="images/logo.png" alt="The Vapor Place" class="logo-img">
      </a>
      <span class="badge-21">21+</span>
    </div>
    <nav>
      <a href="home.html">Home</a>
      <a href="hours.html">Hours</a>

      <a href="featured.html">Featured</a>
      <a href="top-sellers.html">Top Sellers</a>
      <a href="locations.html">Locations</a>
      <a href="contact.html">Contact</a>
      <a href="info.html">Info</a>

  <main>
    <h1>Menu <span style="color:#0088aa">#3</span></h1>

    <div class="menu-controls">
      <input id="menu-search" type="text" placeholder="Search by name or flavor..." spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off">
      <div class="filter-btns">
        <button class="filter-btn active" data-type="ALL">All</button>
        <button class="filter-btn" data-type="DISP">Disposables</button>
        <button class="filter-btn" data-type="SALT">Salts</button>
        <button class="filter-btn" data-type="SUB">Sub-Ohm</button>
        <button class="filter-btn" data-type="KIT">Kits</button>
      </div>
    </div>

    <div id="menu-count"></div>
    <div class="menu-list" id="menu-list"></div>
    <div id="no-results">No items match your search.</div>
  </main>

  <footer>
    &copy; 2026 The Vapor Place &mdash; Must be 21+ to purchase.
  </footer>

  <script src="js/app.js"></script>
  <script src="js/menu-data.js?v=3"></script>
  <script>
    const MRKT_PLCE = {
      'SALT MRKT PLCE Iced Fuji Pear Mangoberry':   { title: 'Iced Fuji Pear Mangoberry',   subtitle: 'Fuji Apple, Pear, Mango &amp; Berries &mdash; Iced',  desc: 'All the tropical freshness of Fuji Pear Mangoberry, finished with a cool icy exhale.', icon: '🍎 🍐 🥭 🍓 🫐 🧊', iceLevel: 3 },
      'SALT MRKT PLCE Iced Forbidden Berry':        { title: 'Iced Forbidden Berry',        subtitle: 'Tropical Fruit &amp; Mixed Berries &mdash; Iced',     desc: 'The beloved Forbidden Berry blend elevated with a refreshing burst of ice.', icon: '🥝 🍍 🍓 🫐', iceLevel: 3 },
      'MRKT PLCE Blood Orange Tangoberry Card':     { title: 'Blood Orange Tangoberry',     subtitle: 'Blood Orange, Grapefruit &amp; Tangoberries',        desc: 'A bright and vibrant mix of sweet blood orange, juicy grapefruit, and fresh tangoberries!', icon: '🍊 🍓 🫐', iceLevel: 0, solo: true },
      'MRKT PLCE Pineapple Peach Dragonberry Card': { title: 'Pineapple Peach Dragonberry', subtitle: 'Pineapple, Peach &amp; Dragonfruit',                  desc: 'Juicy pineapple infused with sweet peaches and a touch of dragonfruit.', icon: '🍍 🍑', iceLevel: 0, solo: true },
      'MRKT PLCE Watermelon Hula Berry Lime Card':  { title: 'Watermelon Hula Berry Lime',  subtitle: 'Watermelon, Hula Berry &amp; Lime',                   desc: 'An infusion of sweet watermelon, hula berry, and fresh-squeezed lime.', icon: '🍈 🫐 🍋‍🟩', iceLevel: 0, solo: true },
      'MRKT PLCE Thai Apple Melon Razz Card':       { title: 'Thai Apple Melon Razz',       subtitle: 'Apple, Melon &amp; Raspberry',                        desc: 'Bold apple, lush melon, and zesty raspberry come together in a lively, flavorful vapor.', icon: '🍎 🍈', iceLevel: 0, solo: true },
      'MRKT PLCE Forbidden Berry Collection':      { title: 'Forbidden Berry',             subtitle: 'Tropical Fruit &amp; Mixed Berries', icon: '🥝 🍍 🍓 🫐',
        desc: 'Perfectly captures the flavors of tropical fruit intermingled with a mixed berry combination – forbidden fruit tastes the best.',
        imageIced: 'mrkt-plce-iced-forbidden-berry.jpg',
        iceLevelRegular: 0, iceLevelIced: 3, bottomIcon: '🧊', combo: true },
      'Reds Apple Apple Berries Collection':    { title: 'Apple Berries',    subtitle: 'Red Apple &amp; Mixed Berries',  icon: '🍎 🫐', desc: 'A crisp, sweet red apple base loaded with a medley of fresh-picked berries.',          logo: 'reds-logo.jpg', logoStyle: 'max-height:60px;width:auto;background:transparent;', saltSize: '30ml', saltStr: '30mg / 50mg', subSize: '100ml', subStr: '0mg / 3mg / 6mg', vgpg: '70VG/30PG', imageIced: '7daze-reds-iced-apple-berries-iced.png',   iceLevelRegular: 0, iceLevelIced: 3, bottomIcon: '🧊', combo: true },
      'Reds Apple Apple Gold Kiwi Collection':  { title: 'Apple Gold Kiwi',  subtitle: 'Red Apple &amp; Golden Kiwi',    icon: '🍎 🥝', desc: 'Sweet red apple paired with the tropical tang of golden kiwi.',                     logo: 'reds-logo.jpg', logoStyle: 'max-height:60px;width:auto;background:transparent;', saltSize: '30ml', saltStr: '30mg / 50mg', subSize: '100ml', subStr: '0mg / 3mg / 6mg', vgpg: '70VG/30PG', imageIced: '7daze-reds-apple-gold-kiwi-iced.png',       iceLevelRegular: 0, iceLevelIced: 3, bottomIcon: '🧊', combo: true },
      'Reds Apple Apple Grape Collection':      { title: 'Apple Grape',      subtitle: 'Red Apple &amp; Grape',          icon: '🍎 🍇', desc: 'Crisp red apple meets sweet, juicy grape for a fruity classic.',                    logo: 'reds-logo.jpg', logoStyle: 'max-height:60px;width:auto;background:transparent;', saltSize: '30ml', saltStr: '30mg / 50mg', subSize: '100ml', subStr: '0mg / 3mg / 6mg', vgpg: '70VG/30PG', imageIced: '7daze-reds-iced-apple-grape-iced.png',       iceLevelRegular: 0, iceLevelIced: 3, bottomIcon: '🧊', combo: true },
      'Reds Apple Apple Original Collection':   { title: 'Apple Original',   subtitle: 'The Classic Red Apple',          icon: '🍎',    desc: 'The iconic original — a perfectly sweet and crisp red apple vape.',                logo: 'reds-logo.jpg', logoStyle: 'max-height:60px;width:auto;background:transparent;', saltSize: '30ml', saltStr: '30mg / 50mg', subSize: '100ml', subStr: '0mg / 3mg / 6mg', vgpg: '70VG/30PG', imageIced: '7daze-reds-iced-apple-original-iced.png',     iceLevelRegular: 0, iceLevelIced: 3, bottomIcon: '🧊', combo: true },
      'Reds Apple Apple Strawberry Collection': { title: 'Apple Strawberry', subtitle: 'Red Apple &amp; Strawberry',     icon: '🍎 🍓', desc: 'Fresh red apple blended with ripe, sun-ripened strawberry.',                       logo: 'reds-logo.jpg', logoStyle: 'max-height:60px;width:auto;background:transparent;', saltSize: '30ml', saltStr: '30mg / 50mg', subSize: '100ml', subStr: '0mg / 3mg / 6mg', vgpg: '70VG/30PG', imageIced: '7daze-reds-iced-apple-strawberry-ice.png',    iceLevelRegular: 0, iceLevelIced: 3, bottomIcon: '🧊', combo: true },
      'Reds Apple Apple Watermelon Collection': { title: 'Apple Watermelon', subtitle: 'Red Apple &amp; Watermelon',     icon: '🍎 🍉', desc: 'Juicy watermelon meets crisp red apple for a refreshing summer blend.',            logo: 'reds-logo.jpg', logoStyle: 'max-height:60px;width:auto;background:transparent;', saltSize: '30ml', saltStr: '30mg / 50mg', subSize: '100ml', subStr: '0mg / 3mg / 6mg', vgpg: '70VG/30PG', imageIced: '7daze-reds-iced-apple-watermelon-iced.png',   iceLevelRegular: 0, iceLevelIced: 3, bottomIcon: '🧊', combo: true },
      'MRKT PLCE Fuji Pear Mangoberry Collection': { title: 'Fuji Pear Mangoberry',        subtitle: 'Fuji Apple, Pear, Mango &amp; Berries', icon: '🍎 🍐 🥭 🍓 🫐',
        desc: 'A blend of fresh fuji apples, sweet pears, ripe mangos, and succulent berries. A tropical fruit explosion!',
        imageIced: 'mrkt-plce-iced-fuji-pear-mangoberry.jpg',
        iceLevelRegular: 0, iceLevelIced: 3, bottomIcon: '🧊', combo: true },
    };

    const FORBIDDEN_COMBO = {
      name: 'MRKT PLCE Forbidden Berry Collection',
      types: ['SALT', 'SUB'],
      profile: 'Salt 30ml: 24mg / 48mg · Sub-Ohm 100ml: 0mg / 3mg / 6mg | Tropical Fruit, Mixed Berries',
      image: 'mrkt-plce-forbidden-berry.jpg',
      tags: 'MRKT PLCE, Forbidden Berry, Strawberry, Raspberry, Blackberry, Ice, Iced, Berry, Tropical'
    };
    const FUJI_COMBO = {
      name: 'MRKT PLCE Fuji Pear Mangoberry Collection',
      types: ['SALT', 'SUB'],
      profile: 'Salt 30ml: 24mg / 48mg · Sub-Ohm 100ml: 0mg / 3mg / 6mg | Fuji Apple, Pear, Mango, Berry',
      image: 'mrkt-plce-fuji-pear-mangoberry.jpg',
      tags: 'MRKT PLCE, Fuji, Pear, Mango, Berry, Apple, Ice, Iced, Tropical'
    };
    const BLOOD_SOLO       = { name: 'MRKT PLCE Blood Orange Tangoberry Card',     types: ['SALT','SUB'], profile: 'Salt 30ml: 24mg / 48mg · Sub-Ohm 100ml: 0mg / 3mg / 6mg | Blood Orange, Grapefruit, Tangoberries', image: 'mrkt-plce-blood-orange-tangoberry.jpg',     tags: 'MRKT PLCE, Blood Orange, Grapefruit, Tangoberries, Citrus, Berry' };
    const PINE_SOLO        = { name: 'MRKT PLCE Pineapple Peach Dragonberry Card', types: ['SALT','SUB'], profile: 'Salt 30ml: 24mg / 48mg · Sub-Ohm 100ml: 0mg / 3mg / 6mg | Pineapple, Peach, Dragonfruit',        image: 'mrkt-plce-pineapple-peach-dragonberry.jpg', tags: 'MRKT PLCE, Pineapple, Peach, Dragonberry, Dragonfruit, Tropical' };
    const WATERMELON_SOLO  = { name: 'MRKT PLCE Watermelon Hula Berry Lime Card',  types: ['SALT','SUB'], profile: 'Salt 30ml: 24mg / 48mg · Sub-Ohm 100ml: 0mg / 3mg / 6mg | Watermelon, Hula Berry, Lime',          image: 'mrkt-plce-watermelon-hula-berry-lime.jpg',  tags: 'MRKT PLCE, Watermelon, Hula Berry, Lime, Berry, Tropical' };
    const THAI_SOLO        = { name: 'MRKT PLCE Thai Apple Melon Razz Card',       types: ['SALT','SUB'], profile: 'Salt 30ml: 24mg / 48mg · Sub-Ohm 100ml: 0mg / 3mg / 6mg | Apple, Melon, Raspberry',              image: 'mrkt-plce-thai-apple-melon-razz.jpg',       tags: 'MRKT PLCE, Thai Apple, Melon, Raspberry, Razz, Fruit' };

    const COMBO_REPLACED = new Set([
      'SALT MRKT PLCE Forbidden Berry',       'SALT MRKT PLCE Iced Forbidden Berry',
      'SALT MRKT PLCE Fuji Pear Mangoberry',  'SALT MRKT PLCE Iced Fuji Pear Mangoberry',
      'SALT MRKT PLCE Blood Orange Tangoberry',
      'SALT MRKT PLCE Pineapple Peach Dragonberry',
      'SALT MRKT PLCE Watermelon Hula Berry Lime',
      'SALT MRKT PLCE Thai Apple Melon Razz',
    ]);
    const mkReds = (flavor, image, imageIced, icon, desc) => ({
      name: `Reds Apple ${flavor} Collection`,
      types: ['SALT','SUB'],
      profile: `Salt 30ml: 30mg / 50mg · Sub-Ohm 100ml: 0mg / 3mg / 6mg | ${flavor}`,
      image, tags: `Reds Apple, 7Daze, ${flavor}, Apple, Ice, Iced`
    });
    const REDS_BERRIES     = mkReds('Apple Berries',     '7daze-reds-apple-berries.png',       '7daze-reds-iced-apple-berries-iced.png');
    const REDS_GOLDKIWI    = mkReds('Apple Gold Kiwi',   '7daze-reds-apple-gold-kiwi.png',     '7daze-reds-apple-gold-kiwi-iced.png');
    const REDS_GRAPE       = mkReds('Apple Grape',       '7daze-reds-apple-grape.png',         '7daze-reds-iced-apple-grape-iced.png');
    const REDS_ORIGINAL    = mkReds('Apple Original',    '7daze-reds-apple-original.png',      '7daze-reds-iced-apple-original-iced.png');
    const REDS_STRAWBERRY  = mkReds('Apple Strawberry',  '7daze-reds-apple-strawberry.png',    '7daze-reds-iced-apple-strawberry-ice.png');
    const REDS_WATERMELON  = mkReds('Apple Watermelon',  '7daze-reds-apple-watermelon.png',    '7daze-reds-iced-apple-watermelon-iced.png');

    let allItems = [...MENU_DATA.filter(i => !COMBO_REPLACED.has(i.name)), FORBIDDEN_COMBO, FUJI_COMBO, BLOOD_SOLO, PINE_SOLO, WATERMELON_SOLO, THAI_SOLO, REDS_BERRIES, REDS_GOLDKIWI, REDS_GRAPE, REDS_ORIGINAL, REDS_STRAWBERRY, REDS_WATERMELON];
    let activeType = 'ALL';
    const typeLabels = { DISP: 'Disposable', SALT: 'Salt Nic', SUB: 'Sub-Ohm', KIT: 'Kit' };

    function itemTypeMatch(item, type) {
      if (type === 'ALL') return true;
      return item.types ? item.types.includes(type) : item.name.startsWith(type);
    }

    render();

    function render() {
      const query = document.getElementById('menu-search').value.toLowerCase();
      const list = document.getElementById('menu-list');
      const count = document.getElementById('menu-count');
      const noResults = document.getElementById('no-results');

      const filtered = allItems.filter(item => {
        const typeMatch = itemTypeMatch(item, activeType);
        const searchMatch = !query ||
          item.name.toLowerCase().includes(query) ||
          item.profile.toLowerCase().includes(query) ||
          (item.tags && item.tags.toLowerCase().includes(query));
        return typeMatch && searchMatch;
      }).sort((a, b) => {
        const nameA = a.name.replace(/^(DISP|SALT|SUB|KIT)\s+/, '').toLowerCase();
        const nameB = b.name.replace(/^(DISP|SALT|SUB|KIT)\s+/, '').toLowerCase();
        return nameA.localeCompare(nameB);
      });

      count.textContent = filtered.length + ' item' + (filtered.length !== 1 ? 's' : '');
      list.innerHTML = '';
      noResults.style.display = filtered.length === 0 ? 'block' : 'none';

      filtered.forEach(item => {
        const mrkt = MRKT_PLCE[item.name];
        const type = item.name.split(' ')[0];
        const displayName = item.name.replace(/^(DISP|SALT|SUB|KIT)\s+/, '');
        const isDual = item.types && item.types.length > 1;
        let sizes = '';
        let flavor = '';
        if (item.profile && item.profile.includes('|')) {
          [sizes, flavor] = item.profile.split('|').map(s => s.trim());
        } else {
          sizes = item.profile || '';
        }

        const saltMl = (sizes.match(/Salt\s+(\d+ml)/i)  || [])[1] || '';
        const subMl  = (sizes.match(/Sub-Ohm\s+(\d+ml(?:\s*\/\s*\d+ml)*)/i) || [])[1] || '';

        const badgeHtml = isDual
          ? item.types.map(t => {
              const prefix = t === 'SALT' && saltMl ? `<span style="font-size:0.78rem;color:#555;margin-right:4px;">${saltMl}</span>` :
                             t === 'SUB'  && subMl  ? `<span style="font-size:0.78rem;color:#555;margin-right:4px;">${subMl}</span>` : '';
              return `<span style="display:inline-flex;align-items:center;">${prefix}<span class="menu-item-type type-${t}">${typeLabels[t] || t}</span></span>`;
            }).join('')
          : (() => {
              const prefix = type === 'SALT' && saltMl ? `<span style="font-size:0.78rem;color:#555;margin-right:4px;">${saltMl}</span>` :
                             type === 'SUB'  && subMl  ? `<span style="font-size:0.78rem;color:#555;margin-right:4px;">${subMl}</span>` : '';
              return `<span style="display:inline-flex;align-items:center;">${prefix}<span class="menu-item-type type-${type}">${typeLabels[type] || type}</span></span>`;
            })();

        const div = document.createElement('div');
        div.className = 'menu-item';

        const iceDotsHtml = (level) => [1,2,3,4,5].map(i =>
          `<span style="display:inline-block;width:11px;height:11px;border-radius:50%;background:${i <= level ? '#0088aa' : '#ddd'};"></span>`
        ).join('');
        const iceBadge = (level) => `
          <div style="display:flex;align-items:center;gap:6px;margin-top:6px;">
            <span style="font-family:'Orbitron',sans-serif;font-size:0.55rem;font-weight:700;letter-spacing:0.08em;color:#0088aa;">ICE</span>
            <div style="display:flex;gap:3px;">${iceDotsHtml(level)}</div>
            <span style="font-family:'Orbitron',sans-serif;font-size:0.55rem;font-weight:700;letter-spacing:0.08em;color:#0088aa;">LEVEL</span>
          </div>`;

        if (mrkt && mrkt.combo) {
          const cLogo    = mrkt.logo    || 'mrkt-plce-logo.svg';
          const cLogoSty = mrkt.logoStyle || 'max-height:56px;width:auto;';
          const cVgPg    = mrkt.vgpg   || '70VG/30PG';
          const cSaltSz  = mrkt.saltSize || '30ml';
          const cSaltStr = mrkt.saltStr  || '24mg / 48mg';
          const cSubSz   = mrkt.subSize  || '100ml';
          const cSubStr  = mrkt.subStr   || '0mg / 3mg / 6mg';
          div.innerHTML = `
            <div style="display:grid;grid-template-columns:auto 1fr auto;align-items:start;gap:20px;margin-bottom:10px;">
              <div style="text-align:center;">
                <img src="images/${item.image}" alt="${mrkt.title}" style="width:160px;border-radius:6px;object-fit:contain;max-height:130px;background:#fff;">
                ${iceBadge(mrkt.iceLevelRegular)}
              </div>
              <div style="text-align:center;">
                <img src="images/${cLogo}" alt="${mrkt.title}" style="${cLogoSty}margin-bottom:8px;display:block;margin-left:auto;margin-right:auto;">
                <div class="menu-item-name">${mrkt.title}</div>
                <div style="font-size:0.9rem;color:#b8860b;margin-top:6px;">${mrkt.subtitle}</div>
                ${mrkt.icon ? `<div style="font-size:1.5rem;margin-top:8px;">${mrkt.icon}</div>` : ''}
                <div style="font-size:0.85rem;color:#555;line-height:1.65;margin-top:10px;text-align:center;">${mrkt.desc}</div>
              </div>
              <div style="text-align:center;">
                <img src="images/${mrkt.imageIced}" alt="Iced ${mrkt.title}" style="width:160px;border-radius:6px;object-fit:contain;max-height:130px;background:#fff;">
                ${mrkt.bottomIcon ? `<div style="font-size:2.1rem;margin-top:4px;">${mrkt.bottomIcon}</div>` : ''}
                ${iceBadge(mrkt.iceLevelIced)}
              </div>
            </div>
            <div style="display:flex;align-items:center;margin-top:10px;border-top:1px solid #ddd;padding-top:10px;">
              <div style="flex:1;display:flex;justify-content:flex-start;">
                <span style="font-size:0.82rem;color:#555;">${cVgPg}</span>
              </div>
              <div style="display:flex;flex-direction:column;gap:6px;align-items:center;">
                <div style="display:flex;align-items:center;gap:6px;">
                  <span style="font-size:0.78rem;color:#555;">${cSaltSz}</span>
                  <span class="menu-item-type type-SALT">Salt Nic</span>
                  <span style="font-size:0.82rem;color:#555;">${cSaltStr}</span>
                </div>
                <div style="display:flex;align-items:center;gap:6px;">
                  <span style="font-size:0.78rem;color:#555;">${cSubSz}</span>
                  <span class="menu-item-type type-SUB">Sub-Ohm</span>
                  <span style="font-size:0.82rem;color:#555;">${cSubStr}</span>
                </div>
              </div>
              <div style="flex:1;"></div>
            </div>
          `;
        } else if (mrkt && mrkt.solo) {
          div.innerHTML = `
            <div style="text-align:center;margin-bottom:12px;">
              <img src="images/mrkt-plce-logo.svg" alt="MRKT PLCE" style="max-height:56px;width:auto;">
            </div>
            <div style="display:grid;grid-template-columns:160px 1fr 160px;align-items:start;gap:20px;margin-bottom:10px;">
              <div style="text-align:center;">
                <img src="images/${item.image}" alt="${mrkt.title}" style="width:160px;border-radius:6px;object-fit:contain;max-height:130px;background:#fff;">
                ${iceBadge(mrkt.iceLevel)}
              </div>
              <div style="text-align:center;">
                <div class="menu-item-name">${mrkt.title}</div>
                <div style="font-size:0.9rem;color:#b8860b;margin-top:6px;">${mrkt.subtitle}</div>
                ${mrkt.icon ? `<div style="font-size:1.5rem;margin-top:8px;">${mrkt.icon}</div>` : ''}
                <div style="font-size:0.85rem;color:#555;line-height:1.65;margin-top:10px;text-align:center;">${mrkt.desc}</div>
              </div>
              <div></div>
            </div>
            <div style="display:flex;align-items:center;margin-top:10px;border-top:1px solid #ddd;padding-top:10px;">
              <div style="flex:1;display:flex;justify-content:flex-start;">
                <span style="font-size:0.82rem;color:#555;">70VG/30PG</span>
              </div>
              <div style="display:flex;flex-direction:column;gap:6px;align-items:center;">
                <div style="display:flex;align-items:center;gap:6px;">
                  <span style="font-size:0.78rem;color:#555;">30ml</span>
                  <span class="menu-item-type type-SALT">Salt Nic</span>
                  <span style="font-size:0.82rem;color:#555;">24mg / 48mg</span>
                </div>
                <div style="display:flex;align-items:center;gap:6px;">
                  <span style="font-size:0.78rem;color:#555;">100ml</span>
                  <span class="menu-item-type type-SUB">Sub-Ohm</span>
                  <span style="font-size:0.82rem;color:#555;">0mg / 3mg / 6mg</span>
                </div>
              </div>
              <div style="flex:1;"></div>
            </div>
          `;
        } else if (mrkt) {
          const iceGauge = mrkt.iceLevel !== undefined ? `
            <div style="display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-top:10px;">
              <span style="font-family:'Orbitron',sans-serif;font-size:0.55rem;font-weight:700;letter-spacing:0.08em;color:#0088aa;">ICE</span>
              <div style="display:flex;gap:3px;">
                ${[1,2,3,4,5].map(i => `<span style="display:inline-block;width:11px;height:11px;border-radius:50%;background:${i <= mrkt.iceLevel ? '#0088aa' : '#ddd'};"></span>`).join('')}
              </div>
              <span style="font-family:'Orbitron',sans-serif;font-size:0.55rem;font-weight:700;letter-spacing:0.08em;color:#0088aa;">LEVEL</span>
            </div>` : '';
          div.innerHTML = `
            <div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;margin-bottom:10px;">
              <div style="text-align:center;">
                <img src="images/mrkt-plce-logo.svg" alt="MRKT PLCE" style="max-height:56px;width:auto;margin-bottom:8px;display:block;margin-left:auto;margin-right:auto;">
                <div class="menu-item-name">${mrkt.title}</div>
                <div style="font-size:0.9rem;color:#b8860b;margin-top:6px;">${mrkt.subtitle}</div>
                ${mrkt.icon ? `<div style="font-size:1.5rem;margin-top:6px;">${mrkt.icon}</div>` : ''}
              </div>
              ${item.image ? `<img src="images/${item.image}" alt="${mrkt.title}" style="width:180px;border-radius:6px;object-fit:contain;max-height:140px;background:#fff;">` : '<div style="width:180px;"></div>'}
              <div style="font-size:0.85rem;color:#555;line-height:1.65;text-align:left;">${mrkt.desc}</div>
            </div>
            <div style="display:flex;align-items:center;margin-top:10px;border-top:1px solid #ddd;padding-top:10px;">
              <div style="flex:1;display:flex;justify-content:flex-start;">
                <span style="font-size:0.82rem;color:#555;">70VG/30PG</span>
              </div>
              <div style="display:flex;gap:12px;align-items:center;">
                <div style="display:flex;align-items:center;gap:6px;">
                  <span style="font-size:0.78rem;color:#555;">30ml</span>
                  <span class="menu-item-type type-SALT">Salt Nic</span>
                  <span style="font-size:0.82rem;color:#555;">24mg / 48mg</span>
                </div>
                <span style="font-size:0.9rem;color:#555;">&amp;</span>
                <div style="display:flex;align-items:center;gap:6px;">
                  <span style="font-size:0.78rem;color:#555;">100ml</span>
                  <span class="menu-item-type type-SUB">Sub-Ohm</span>
                  <span style="font-size:0.82rem;color:#555;">0mg / 3mg / 6mg</span>
                </div>
              </div>
              <div style="flex:1;display:flex;justify-content:flex-end;">
                ${mrkt.iceLevel !== undefined ? `
                <div style="display:flex;align-items:center;gap:6px;">
                  <span style="font-family:'Orbitron',sans-serif;font-size:0.55rem;font-weight:700;letter-spacing:0.08em;color:#0088aa;">ICE</span>
                  <div style="display:flex;gap:3px;">${iceDotsHtml(mrkt.iceLevel)}</div>
                  <span style="font-family:'Orbitron',sans-serif;font-size:0.55rem;font-weight:700;letter-spacing:0.08em;color:#0088aa;">LEVEL</span>
                </div>` : ''}
              </div>
            </div>
          `;
        } else {
          div.innerHTML = `
            <div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;margin-bottom:10px;">
              <div style="text-align:center;">
                <div class="menu-item-name">${displayName}</div>
                ${flavor ? `<div style="font-size:0.98rem;color:#b8860b;margin-top:6px;">${flavor}</div>` : ''}
              </div>
              ${item.image ? `<img src="images/${item.image}" alt="${displayName}" style="width:180px;border-radius:6px;object-fit:contain;max-height:140px;background:#fff;">` : '<div style="width:180px;"></div>'}
              <div style="font-size:0.82rem;color:#555;text-align:center;">${sizes}</div>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:4px;">${badgeHtml}</div>
            ${item.price ? `<div style="font-family:'Orbitron',sans-serif;font-size:1rem;font-weight:700;color:#aaff00;margin-top:8px;text-align:center;">${item.price}</div>` : ''}
            ${item.link ? `<a href="${item.link}" style="display:block;margin-top:10px;font-size:0.75rem;color:#0088aa;text-decoration:none;font-family:'Orbitron',sans-serif;letter-spacing:0.05em;text-align:center;">Learn More &rarr;</a>` : ''}
          `;
        }
        list.appendChild(div);
      });
    }

    const params = new URLSearchParams(window.location.search);
    if (params.get('q')) {
      document.getElementById('menu-search').value = params.get('q');
      render();
    }

    document.getElementById('menu-search').addEventListener('input', render);

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeType = btn.dataset.type;
        render();
      });
    });
  </script>

</div>
</body>
</html>
