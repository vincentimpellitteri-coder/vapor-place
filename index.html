<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Vapor Place — Age Verification</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body id="age-gate-page" class="age-gate-page">

  <div class="age-gate-box">
    <img src="images/logo.png" alt="The Vapor Place" class="logo-img">

    <h1>Are you 21 or older?</h1>
    <p>You must be 21 years of age or older to enter this site.</p>

    <div class="age-gate-btns">
      <button id="btn-yes" class="btn-yes">Yes, I am 21+</button>
      <button id="btn-no"  class="btn-no">No</button>
    </div>

    <p class="age-disclaimer">
      By entering this site you confirm you are of legal age to purchase tobacco
      and vaping products in your jurisdiction. This site uses session storage to
      remember your verification within a single browser session.
    </p>
  </div>

  <script src="js/app.js"></script>

  </div>
</body>
</html>
